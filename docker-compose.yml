services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: project_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DataEng#2026"     
      MSSQL_PID: "Developer"                # free edition with all features
    ports:
      - "1433:1433"                         # Codespace port 1433 → SQL Server 1433
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:                            # "healthy" = ready for connections
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mssql_data: