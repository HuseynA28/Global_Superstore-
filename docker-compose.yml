# Weather End-to-End Project
# Start:  docker compose up -d sqlserver        (database only - use this while running the notebooks)
#         docker compose up -d --build           (database + Streamlit app at http://localhost:8501)
# Stop:   docker compose down                   (data is kept in the "sqlserver_data" volume)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: weather_sqlserver
    restart: unless-stopped
    platform: linux/amd64            # needed on Apple Silicon (M1/M2/M3) Macs
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Weather_Pass123!"   # must be 8+ chars with upper, lower, digit, symbol
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Weather_Pass123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver_data:
